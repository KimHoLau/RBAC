<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04081c"/>
      <stop offset="0.55" stop-color="#0a1533"/>
      <stop offset="1" stop-color="#122448"/>
    </linearGradient>
    <radialGradient id="nebulaViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#1c4a8f"/>
      <stop offset="0.55" stop-color="#0e2350"/>
      <stop offset="1" stop-color="#081531"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bcd9ff" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#7db2ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7db2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66b3f0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#66b3f0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe4ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#cfe4ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- 深空 -->
  <rect width="1920" height="1080" fill="url(#space)"/>

  <!-- 星云 -->
  <ellipse cx="380" cy="260" rx="560" ry="360" fill="url(#nebulaViolet)"/>
  <ellipse cx="1560" cy="330" rx="640" ry="400" fill="url(#nebulaBlue)"/>
  <ellipse cx="900" cy="820" rx="700" ry="300" fill="url(#nebulaBlue)" opacity="0.5"/>

  <!-- 行星（右下，只露出弧顶） -->
  <circle cx="1560" cy="1560" r="640" fill="url(#planet)"/>
  <circle cx="1560" cy="1560" r="640" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="1560" cy="922" r="180" fill="url(#nebulaBlue)" filter="url(#blur14)" opacity="0.8"/>

  <!-- 星野 -->
  <g fill="#ffffff">
    <circle cx="120" cy="120" r="1.6" opacity="0.8"/>
    <circle cx="260" cy="420" r="1.2" opacity="0.5"/>
    <circle cx="340" cy="90" r="1" opacity="0.45"/>
    <circle cx="480" cy="300" r="1.5" opacity="0.7"/>
    <circle cx="560" cy="640" r="1.1" opacity="0.4"/>
    <circle cx="640" cy="160" r="1.3" opacity="0.6"/>
    <circle cx="730" cy="380" r="1" opacity="0.45"/>
    <circle cx="820" cy="90" r="1.7" opacity="0.85"/>
    <circle cx="905" cy="260" r="1.1" opacity="0.5"/>
    <circle cx="1010" cy="150" r="1.4" opacity="0.7"/>
    <circle cx="1120" cy="330" r="1" opacity="0.4"/>
    <circle cx="1230" cy="110" r="1.6" opacity="0.8"/>
    <circle cx="1330" cy="250" r="1.2" opacity="0.55"/>
    <circle cx="1450" cy="90" r="1.1" opacity="0.5"/>
    <circle cx="1560" cy="200" r="1.4" opacity="0.65"/>
    <circle cx="1690" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="1790" cy="300" r="1.5" opacity="0.75"/>
    <circle cx="1860" cy="170" r="1.1" opacity="0.5"/>
    <circle cx="90" cy="560" r="1.3" opacity="0.55"/>
    <circle cx="200" cy="720" r="1.1" opacity="0.45"/>
    <circle cx="410" cy="510" r="1.2" opacity="0.5"/>
    <circle cx="690" cy="560" r="1" opacity="0.4"/>
    <circle cx="1180" cy="470" r="1.2" opacity="0.55"/>
    <circle cx="1420" cy="430" r="1.1" opacity="0.5"/>
    <circle cx="1730" cy="480" r="1.3" opacity="0.6"/>
    <circle cx="1870" cy="560" r="1.2" opacity="0.55"/>
  </g>
  <!-- 亮星（带光晕） -->
  <g>
    <circle cx="500" cy="180" r="26" fill="url(#starGlow)"/>
    <circle cx="1300" cy="180" r="20" fill="url(#starGlow)"/>
    <circle cx="960" cy="500" r="24" fill="url(#starGlow)"/>
    <circle cx="180" cy="330" r="18" fill="url(#starGlow)"/>
  </g>
  <!-- 十字星光 -->
  <g stroke="#cfe4ff" stroke-width="1.5" opacity="0.85">
    <path d="M500 158v44M478 180h44"/>
    <path d="M960 480v40M940 500h40"/>
  </g>
  <!-- 流星（静态） -->
  <g stroke-linecap="round">
    <line x1="1180" y1="120" x2="1330" y2="170" stroke="url(#meteor)" stroke-width="2"/>
    <line x1="300" y1="240" x2="410" y2="280" stroke="url(#meteor)" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- 透视网格地平线 -->
  <g stroke="#2f81ff" stroke-width="1.2" opacity="0.5">
    <!-- 纵向：向灭点 (960,700) 收敛 -->
    <line x1="0" y1="1080" x2="960" y2="700"/>
    <line x1="240" y1="1080" x2="960" y2="700"/>
    <line x1="480" y1="1080" x2="960" y2="700"/>
    <line x1="720" y1="1080" x2="960" y2="700"/>
    <line x1="960" y1="1080" x2="960" y2="700"/>
    <line x1="1200" y1="1080" x2="960" y2="700"/>
    <line x1="1440" y1="1080" x2="960" y2="700"/>
    <line x1="1680" y1="1080" x2="960" y2="700"/>
    <line x1="1920" y1="1080" x2="960" y2="700"/>
    <!-- 横向：近密远疏 -->
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="748" x2="1920" y2="748"/>
    <line x1="0" y1="786" x2="1920" y2="786"/>
    <line x1="0" y1="838" x2="1920" y2="838"/>
    <line x1="0" y1="906" x2="1920" y2="906"/>
    <line x1="0" y1="992" x2="1920" y2="992"/>
  </g>
  <!-- 地平线辉光 -->
  <line x1="0" y1="700" x2="1920" y2="700" stroke="#4da3ff" stroke-width="3" filter="url(#blur6)" opacity="0.9"/>
  <line x1="0" y1="700" x2="1920" y2="700" stroke="#cfe4ff" stroke-width="1.2" opacity="0.8"/>
</svg>
