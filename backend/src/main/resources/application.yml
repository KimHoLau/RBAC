server:
  port: 8080

spring:
  application:
    name: rbac-system
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rbac_system}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET:RbacJwtSecretKey_0123456789abcdef0123456789abcdef}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

logging:
  level:
    com.example.system: info
